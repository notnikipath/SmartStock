services:
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: smartstock-api-gateway
    env_file: .env
    ports:
      - "31000:8000"
    depends_on:
      - inventory-service
      - forecast-service
      - optimization-service
      - placement-service
      - analytics-service
      - integration-service
      - notification-service
      - storage-service
    networks: [smartstock-net]

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: smartstock-inventory
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks: [smartstock-net]

  forecast-service:
    build:
      context: .
      dockerfile: forecast-service/Dockerfile
    container_name: smartstock-forecast
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - clickhouse
    networks: [smartstock-net]

  optimization-service:
    build:
      context: .
      dockerfile: optimization-service/Dockerfile
    container_name: smartstock-optimization
    env_file: .env
    ports:
      - "8003:8003"
    depends_on:
      - redis
    networks: [smartstock-net]

  placement-service:
    build:
      context: .
      dockerfile: placement-service/Dockerfile
    container_name: smartstock-placement
    env_file: .env
    ports:
      - "8004:8004"
    networks: [smartstock-net]

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    container_name: smartstock-analytics
    env_file: .env
    ports:
      - "8005:8005"
    depends_on:
      - clickhouse
    networks: [smartstock-net]

  integration-service:
    build:
      context: .
      dockerfile: integration-service/Dockerfile
    container_name: smartstock-integration
    env_file: .env
    ports:
      - "8006:8006"
    networks: [smartstock-net]

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: smartstock-notification
    env_file: .env
    ports:
      - "8007:8007"
    networks: [smartstock-net]

  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    container_name: smartstock-storage
    env_file: .env
    ports:
      - "8008:8008"
    depends_on:
      - minio
    networks: [smartstock-net]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: smartstock-frontend
    env_file: .env
    ports:
      - "32131:5173"
    depends_on:
      - api-gateway
    networks: [smartstock-net]

  postgres:
    image: postgres:16
    container_name: smartstock-postgres
    environment:
      POSTGRES_DB: smartstock
      POSTGRES_USER: smartstock
      POSTGRES_PASSWORD: smartstock
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [smartstock-net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: smartstock-clickhouse
    ports:
      - "30000:8123"
      - "9002:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks: [smartstock-net]

  redis:
    image: redis:7
    container_name: smartstock-redis
    ports:
      - "6379:6379"
    networks: [smartstock-net]

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: smartstock-rabbitmq
    ports:
      - "32132:5672"
      - "32133:15672"
    networks: [smartstock-net]

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: smartstock-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "32134:9000"
      - "32135:9001"
    volumes:
      - minio_data:/data
    networks: [smartstock-net]

networks:
  smartstock-net:
    driver: bridge

volumes:
  postgres_data:
  clickhouse_data:
  minio_data:
