name: SmartStock CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - inventory-service
          - forecast-service
          - optimization-service
          - placement-service
          - analytics-service
          - integration-service
          - notification-service
          - storage-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: smartstock/${{ matrix.service }}:latest
